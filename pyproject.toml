[project]
name = "nonebot-plugin-anti-recall-ltd"
version = "0.1.0"
description = "A NoneBot2 plugin to log recalled messages in QQ groups"
authors = [{name = "Wojusensei", email = "3442006415@qq.com"}]
requires-python = ">=3.10"
dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-adapter-onebot>=2.0.0",
    "nonebot-plugin-orm[default]>=0.7.0",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot-plugin-localstore>=0.5.0",
    "Pillow>=10.0.0",
    "aiohttp>=3.9.0",
]

[tool.setuptools]
packages = ["nonebot_plugin_anti_recall"]

[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"